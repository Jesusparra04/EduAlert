<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAlert · Sistema digital para CECAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="login" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo">♥</span><div><b id="brandName"></b><small>CECAR</small></div></div>
    <nav id="nav" aria-label="Módulos"></nav>
    <div class="user">
      <span class="av" id="uAv"></span>
      <div><b id="uName"></b><small id="uRole"></small></div>
      <button class="ghost" data-action="switch" title="Cambiar de rol" aria-label="Cambiar de rol">⇄</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="ttl"></h1><p id="sub"></p></div>
      <div class="top-r">
        <input id="q" type="search" placeholder="Buscar estudiante…" aria-label="Buscar estudiante">
        <span class="pill" id="period" hidden>Período 2025-1</span>
        <span class="bell" aria-label="Notificaciones">🔔<i>2</i></span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/views-coordinador.js"></script>
<script src="js/views-bienestar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
